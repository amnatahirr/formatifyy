[pytest]
# Run from repo root OR from backend/:
#   pytest -c tests_full/pytest.ini
#   cd backend && pytest -c tests_full/pytest.ini

testpaths = .
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Keep normal runs fast — enable timing with:
#   pytest -m performance --benchmark-enable -c tests_full/pytest.ini
addopts =
    -ra
    --strict-markers
    --benchmark-disable
    --tb=short

markers =
    p0: Priority 0 — critical multi-tenant / auth / document happy path
    p1: Priority 1 — freeform, FYP lifecycle, collaboration, plagiarism
    p2: Priority 2 — Drive, QR-adjacent APIs, super-admin, tables/images/TOC
    p3: Priority 3 — error/timeout/edge negatives
    auth: Authentication and JWT
    fyp: Final Year Project student/supervisor flows
    vc: Version-control / collaboration
    admin: Admin portal APIs
    plagiarism: Plagiarism corpus / detector
    pipeline: Analysis pipeline (parse/batch/dispatch/aggregate/reformat)
    accuracy: Precision/recall/F1 regression gates
    performance: Timing / memory / CPU benchmarks (use --benchmark-enable)
    slow: Expensive end-to-end runs (real LLM agents); excluded from default fast CI

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
